<!DOCTYPE html>
<html>

<head>
     <meta charset="UTF-8">
     <title>Crop Screenshot</title>
     <style>
          body {
               margin: 0;
               overflow: hidden;
               user-select: none;
               background: transparent
          }

          #bgcanvas,
          #overlay {
               position: absolute;
               top: 0;
               left: 0;
               cursor: crosshair;
               visibility: hidden;
          }

          #loading {
               position: fixed;
               top: 50%;
               left: 50%;
               transform: translate(-50%, -50%);
               color: white;
               font-family: monospace;
               font-size: 18px;
               opacity: 0.7;
          }

          #okBtn {
               position: fixed;
               top: 20px;
               right: 20px;
               z-index: 20;
               font-size: 20px;
               padding: 6px 20px;
          }
     </style>
</head>

<body>
     <div id="loading">Loading...</div>
     <canvas id="bgcanvas"></canvas>
     <canvas id="overlay"></canvas>
     <script src="./src/Scripts/crop.js"></script>
</body>

</html>
