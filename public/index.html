<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <title>Electron React Boilerplate</title>
     <style>
          @font-face {
               font-family: 'MiFuentePersonalizada';
               src: url('./custom_font.ttf') format('truetype');
               font-weight: normal;
               font-style: normal;
          }

          html,
          body,

<body>
     <div id="root"></div>
     <script src="../dist/bundle.js"></script>

</html>
